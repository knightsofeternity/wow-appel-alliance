name: tests
on:
  push:
  pull_request:
jobs:
  bancs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - run: lua5.1 test/alliance.lua | tee /tmp/alliance.txt && grep -q 'tout est vert' /tmp/alliance.txt
      - run: lua5.1 test/sonde.lua | tee /tmp/sonde.txt && grep -q 'tout est vert' /tmp/sonde.txt
